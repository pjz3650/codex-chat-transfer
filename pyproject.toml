[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-vault"
version = "0.1.0"
description = "Acervo pessoal do Codex com sincronização por dispositivo e ferramentas MCP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "mcp>=1.30,<2",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "typer>=0.15,<1", "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "pytest-cov>=6", "ruff>=0.9"]
browser = ["playwright>=1.49"]

[project.scripts]
cvault = "codex_vault.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_vault = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607"]
